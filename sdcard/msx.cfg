# MSX emulator configuration (all file names are in the SD root)
bios=msx1.rom
# cart=game.rom
# mapper=auto        (auto | plain | konami | scc | ascii8 | ascii16)
# cas=tape.cas
# audio=hdmi        (hdmi = monitor/TV speakers | jack = 3.5 mm output | off)
# tapebar=on       (on | off: progress bar while the tape is loading)
# debug=off        (on: top-left frame counter, Z80 address and tape state; for troubleshooting)
